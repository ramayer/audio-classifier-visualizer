[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-classifier-visualizer"
version = "1.0.0"
description = "Time-aligned visualization of waveforms, spectrograms, labels, and classifier output for long audio files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ron Mayer" }]

# Deliberately minimal: no torch, no torchaudio/torchcodec. Loading is
# soundfile-based; STFT and CWT are optional extras since not every use
# of the core data model / facade needs either.
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
stft = ["librosa>=0.10"]
wavelet = ["ssqueezepy>=0.6.5", "einx>=0.2"]
plot = ["matplotlib>=3.8"]
gpu = ["torch", "cupy-cuda13x"]
all = ["audio-classifier-visualizer[stft,wavelet,plot]"]
dev = ["audio-classifier-visualizer[all]", "pytest>=8.0", "pytest-cov", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/audio_classifier_visualizer"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
